# Docker profile configuration
spring.application.name=llm-chat-service
server.port=8080

# Ollama Configuration for Docker
spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.top-p=0.9
spring.ai.ollama.chat.options.num-predict=2048

# Logging Configuration
logging.level.com.llm.serving=INFO
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# CORS Configuration
cors.allowed-origins=http://localhost,http://localhost:80,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# System Template Configuration
llm.system.template=You are a helpful AI assistant powered by Llama-3 running in a containerized environment. You provide accurate, concise, and helpful responses to user questions. Always be polite and professional in your responses.
llm.max-tokens=2048
llm.timeout=60000

# Performance tuning
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
