version: '3.8'

services:
  # AI Agent service (your custom no-framework agent)
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent-no-framework-prod
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_NAME=llama3.1:8b-instruct-q4_0
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - ENVIRONMENT=production
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
    depends_on:
      - ollama
    networks:
      - ai-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Ollama service for LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service-prod
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./ollama-models:/models:ro
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=2
    networks:
      - ai-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '4.0'
        reservations:
          memory: 6G
          cpus: '2.0'
    # Uncomment if you have NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Open WebUI for chat interface
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-aiagent-prod
    ports:
      - "3000:8080"
    environment:
      # Connect to AI Agent instead of OpenAI
      - OPENAI_API_BASE_URL=http://ai-agent:8000/v1
      - OPENAI_API_KEY=sk-aiagent-production-key
      - DEFAULT_MODELS=ai-agent-no-framework
      - WEBUI_NAME=AI Agent Production Interface
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=user
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_LOGIN_FORM=true
      - ENABLE_COMMUNITY_SHARING=false
      - SHOW_ADMIN_DETAILS=false
      - ENABLE_MODEL_FILTER=true
    volumes:
      - open-webui-data:/app/backend/data
      - ./open-webui-config.json:/app/backend/config.json:ro
      - ./logs:/app/logs
    depends_on:
      - ai-agent
    networks:
      - ai-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Nginx reverse proxy (optional for production)
  nginx:
    image: nginx:alpine
    container_name: ai-agent-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - open-webui
      - ai-agent
    networks:
      - ai-agent-network
    restart: unless-stopped

networks:
  ai-agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  ollama-data:
    driver: local
  open-webui-data:
    driver: local
