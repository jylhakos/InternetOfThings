# Nginx configuration for OpenClaw reverse proxy with security
# Place in: /etc/nginx/sites-available/openclaw
# Create symlink: ln -s /etc/nginx/sites-available/openclaw /etc/nginx/sites-enabled/openclaw

# Rate limiting to prevent abuse
limit_req_zone $binary_remote_addr zone=openclaw_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=openclaw_conn:10m;

# Upstream to OpenClaw Gateway
upstream openclaw_backend {
    server 127.0.0.1:18789;
    keepalive 32;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openclaw.yourdomain.com;  # Change this to your domain
    
    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/openclaw.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclaw.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # Strong SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Basic Authentication (first layer of defense)
    auth_basic "OpenClaw Access - Authentication Required";
    auth_basic_user_file /etc/nginx/.htpasswd;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Remove server identification
    server_tokens off;
    
    # Logging
    access_log /var/log/nginx/openclaw_access.log combined;
    error_log /var/log/nginx/openclaw_error.log warn;
    
    # Rate limiting
    limit_req zone=openclaw_limit burst=20 nodelay;
    limit_conn openclaw_conn 10;
    
    # Client body size limit
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Main proxy location
    location / {
        # Proxy to OpenClaw
        proxy_pass http://openclaw_backend;
        proxy_redirect off;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://openclaw_backend/health;
        access_log off;
        auth_basic off;
        allow 127.0.0.1;
        deny all;
    }
    
    # Deny access to sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Optional: Metrics endpoint for monitoring (restricted)
    location /metrics {
        proxy_pass http://openclaw_backend/metrics;
        allow 127.0.0.1;
        deny all;
    }
}

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name openclaw.yourdomain.com;
    
    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
