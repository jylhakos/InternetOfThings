spring:
  application:
    name: spring-ai-rag-demo
  
  ai:
    # Ollama Configuration
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
    
    # Qdrant Vector Store Configuration
    qdrant:
      host: localhost
      port: 6334
      api-key: ${QDRANT_API_KEY:}
      collection-name: spring-ai-documentation
      use-tls: false
    
    # Alternative: Chroma Vector Store Configuration (if using Chroma instead)
    # chroma:
    #   base-url: http://localhost:8000
    #   collection-name: spring-ai-documentation

# Server Configuration
server:
  port: 8080

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.springaidemo: DEBUG
    org.springframework.ai: DEBUG

# Document Ingestion Configuration
app:
  documents:
    path: classpath:documents/
    auto-ingest: true
