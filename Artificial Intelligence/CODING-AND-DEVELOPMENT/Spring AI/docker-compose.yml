version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: spring-ai-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Alternative: Chroma Vector Database
  # Uncomment the following section to use Chroma instead of Qdrant
  # chroma:
  #   image: chromadb/chroma:latest
  #   container_name: spring-ai-chroma
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./chroma_data:/chroma/chroma
  #   restart: unless-stopped

# Note: Ollama needs to be installed separately on the host machine
# as it has better performance when running directly on the host
# Install from: https://ollama.com/
# Then run: ollama pull llama3.2 && ollama pull nomic-embed-text
