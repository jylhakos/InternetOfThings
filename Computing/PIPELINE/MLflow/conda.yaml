name: fish_weight_prediction
channels:
  - conda-forge
  - defaults
  - pyviz
dependencies:
  # Core Python and build tools
  - python=3.9
  - pip
  - make
  - git
  
  # Scientific computing (conda managed for better performance)
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.11.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.0.0
  
  # Machine Learning (conda managed for optimized builds)
  - scikit-learn>=1.3.0
  - joblib>=1.3.0
  
  # Web and API frameworks
  - requests>=2.31.0
  - curl
  
  # Jupyter for development
  - jupyter
  - notebook
  
  # System utilities
  - wget
  
  # pip-only packages
  - pip:
    - mlflow[pipelines]>=2.8.0
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - pydantic>=2.5.0
    - click>=8.0.0
    - boto3>=1.29.0
    - awscli>=1.29.0
    - sagemaker>=2.190.0
    - python-dotenv>=1.0.0
    - pytest>=7.4.0
    - pytest-cov>=4.1.0
    - black>=23.0.0
    - flake8>=6.0.0
