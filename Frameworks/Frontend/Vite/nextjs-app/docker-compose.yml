version: '3.8'

services:
  # Next.js Development Server
  nextjs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nextjs-iot-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js Production Server
  nextjs-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-iot-prod
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - iot-network
    restart: unless-stopped
    profiles: ["production"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/server-info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: nextjs-iot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - nextjs-prod
    networks:
      - iot-network
    restart: unless-stopped
    profiles: ["production"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching (optional)
  redis:
    image: redis:alpine
    container_name: nextjs-iot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot-network
    restart: unless-stopped
    profiles: ["production"]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (optional)
  postgres:
    image: postgres:15-alpine
    container_name: nextjs-iot-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=iot_app
      - POSTGRES_USER=iot_user
      - POSTGRES_PASSWORD=iot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - iot-network
    restart: unless-stopped
    profiles: ["production"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_app"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  iot-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
