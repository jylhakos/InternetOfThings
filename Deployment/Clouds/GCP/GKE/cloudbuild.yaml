steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/go-web-app:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/go-web-app:$COMMIT_SHA']
  
  # Apply the manifests to the GKE cluster
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
    - run
    - --filename=k8s/
    - --image=gcr.io/$PROJECT_ID/go-web-app:$COMMIT_SHA
    - --location=us-central1-a
    - --cluster=my-go-app-cluster

images:
- 'gcr.io/$PROJECT_ID/go-web-app:$COMMIT_SHA'