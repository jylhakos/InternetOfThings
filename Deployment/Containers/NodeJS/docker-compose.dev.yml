version: '3.8'

services:
  backend:
    build:
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: ["dumb-init", "npm", "run", "dev"]

  frontend:
    build:
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["dumb-init", "npm", "start"]